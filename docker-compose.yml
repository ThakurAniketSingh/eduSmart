# eduSmart - local PostgreSQL only.
#
# Java code execution does NOT go through this file - it runs via direct
# `docker run` calls made by the backend (see backend/docker/java-runner and
# CodeExecutionService), so nothing else needs to be defined here.
#
# Usage:
#   docker compose up -d
#   docker compose down          (stop)
#   docker compose down -v       (stop and wipe the database volume)

services:
  postgres:
    image: postgres:16-alpine
    container_name: edusmart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: edusmart
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - edusmart-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  edusmart-postgres-data:
