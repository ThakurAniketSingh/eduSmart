version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: edusmart-db
    environment:
      POSTGRES_DB: edusmart
      POSTGRES_USER: edusmart_user
      POSTGRES_PASSWORD: edusmart_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
